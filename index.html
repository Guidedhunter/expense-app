<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My expenses</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap">
<style>
:root{--bg:#F6F7F3;--surface:#FFFFFF;--ink:#14231C;--muted:#5B6B62;--line:#DAE1DB;--accent:#0F6B45;--accent-ink:#FFFFFF;--danger:#B5362B;--l:40%;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1713;--surface:#17221C;--ink:#E8EFEA;--muted:#93A59A;--line:#2A3A31;--accent:#4FC88D;--accent-ink:#08140E;--danger:#FF8A7A;--l:62%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1713;--surface:#17221C;--ink:#E8EFEA;--muted:#93A59A;--line:#2A3A31;--accent:#4FC88D;--accent-ink:#08140E;--danger:#FF8A7A;--l:62%;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav h1{margin:0;font-size:1.05rem;font-weight:600}
.nav{width:44px;height:44px;border:1px solid var(--line);background:var(--surface);border-radius:50%;font-size:1.3rem;cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.total{margin:18px 0 0;font-size:3.1rem;line-height:1;font-weight:800;letter-spacing:-.02em;font-variation-settings:"opsz" 96}
.total small{font-size:1.2rem;font-weight:600;color:var(--muted);letter-spacing:0}
.sub{margin:6px 0 0;color:var(--muted)}
.add{margin:24px 0;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.add label.f{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.amt{width:100%;padding:10px 12px;font-size:1.8rem;font-weight:700;background:transparent;border:1px solid var(--line);border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;font-size:.95rem}
.chip span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k)}
.chip input:checked+span{border-color:var(--k);box-shadow:inset 0 0 0 1px var(--k);font-weight:600}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:1fr 150px;gap:10px}
.txt{width:100%;padding:10px 12px;background:transparent;border:1px solid var(--line);border-radius:10px}
.save{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.05rem;cursor:pointer}
.msg{min-height:1.4em;margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.msg.err{color:var(--danger)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.stats div{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stats span{display:block;font-size:.85rem;color:var(--muted)}
.stats b{font-size:1.15rem;font-weight:700}
.stats .over b{color:var(--danger)}
.incbox{margin-top:6px}
.incbox summary{cursor:pointer;color:var(--accent);font-weight:600;min-height:44px;display:flex;align-items:center}
.incrow{display:flex;gap:10px}
.incrow .txt{flex:1;font-size:1.1rem;font-weight:600}
.incrow button{padding:0 18px;min-height:44px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-weight:700;cursor:pointer}
h2{font-size:1rem;margin:28px 0 10px;font-weight:700}
.seg{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.seg i{display:block;background:var(--k)}
.legend{list-style:none;margin:12px 0 0;padding:0}
.legend li{display:flex;align-items:center;gap:8px;padding:6px 0}
.legend li::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--k);flex:none}
.legend b{margin-left:auto;font-weight:600}
.legend em{font-style:normal;color:var(--muted);width:3.2em;text-align:right}
.day{display:flex;justify-content:space-between;margin:18px 0 4px;font-size:.9rem;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item .dot{width:10px;height:10px;border-radius:50%;background:var(--k);flex:none}
.item .what{flex:1;min-width:0}
.item .what small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .n{font-weight:700;white-space:nowrap}
.del{min-width:44px;height:44px;border:0;background:transparent;color:var(--muted);border-radius:10px;cursor:pointer;font-size:1.1rem}
.del.sure{color:var(--danger);font-size:.85rem;font-weight:700}
.empty{color:var(--muted);padding:12px 0}
@media (prefers-reduced-motion:no-preference){.seg i{transition:width .3s}}
</style>
</head>
<body>
<main>
  <div class="monthnav">
    <button class="nav" id="prev" aria-label="Previous month">‹</button>
    <h1 id="month"></h1>
    <button class="nav" id="next" aria-label="Next month">›</button>
  </div>
  <p class="total" id="total"></p>
  <p class="sub" id="sub"></p>
  <div class="stats"><div><span>Income</span><b id="inc"></b></div><div id="leftbox"><span id="leftlbl">Left</span><b id="left"></b></div></div>
  <details class="incbox" id="incbox"><summary id="incsum">Set monthly income</summary>
    <form class="incrow" id="incform" autocomplete="off"><input class="txt" id="incamt" inputmode="numeric" placeholder="Income this month (DA)" aria-label="Monthly income in DA"><button type="submit">Save</button></form>
    <p class="msg" id="incmsg" role="status" aria-live="polite"></p>
  </details>

  <form class="add" id="form" autocomplete="off">
    <label class="f" for="amount">Amount (DA)</label>
    <input class="amt" id="amount" inputmode="numeric" placeholder="0">
    <div class="chips" id="chips" role="radiogroup" aria-label="Category"></div>
    <div class="row2">
      <div><label class="f" for="note">Note (optional)</label><input class="txt" id="note" maxlength="60" placeholder="e.g. bread, taxi"></div>
      <div><label class="f" for="date">Date</label><input class="txt" id="date" type="date"></div>
    </div>
    <button class="save" type="submit">Save expense</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <h2>Where it went</h2>
  <div id="breakdown"></div>

  <h2>All expenses</h2>
  <div id="list"></div>
</main>
<script>
(function(){
var KEY="expenses-v1";
var CATS=[["Food",25],["Transport",205],["Phone credit",275],["Bills",45],["Shopping",330],["Health",170],["Fun",95],["Other",215]];
var items=[],canSave=true,sure=null,sureT=null;
try{items=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){canSave=false}
if(!Array.isArray(items))items=[];
var income={};
try{income=JSON.parse(localStorage.getItem("income-v1")||"{}")}catch(e){}
if(!income||typeof income!=="object"||Array.isArray(income))income={};
function incomeFor(m){var k=Object.keys(income).filter(function(x){return x<=m}).sort();return k.length?income[k[k.length-1]]:0}
function persistIncome(){try{localStorage.setItem("income-v1",JSON.stringify(income))}catch(e){canSave=false;setMsg("Your browser can’t save data, so it will be lost when you close this page.",true)}}
function pad(n){return n<10?"0"+n:""+n}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmt(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0")+"\u00A0DA"}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function col(i){return "--k:hsl("+CATS[i][1]+" 55% var(--l))"}
var curMonth=todayStr().slice(0,7),ym=curMonth;
var $=function(id){return document.getElementById(id)};

$("chips").innerHTML=CATS.map(function(c,i){
  return '<label class="chip" style="'+col(i)+'"><input type="radio" name="cat" value="'+i+'"'+(i===0?" checked":"")+'><span>'+c[0]+'</span></label>';
}).join("");
$("date").value=todayStr();

function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){canSave=false;setMsg("Your browser can’t save data, so expenses will be lost when you close this page.",true)}}
function setMsg(t,err){var m=$("msg");m.textContent=t;m.className="msg"+(err?" err":"")}

function render(){
  var p=ym.split("-"),y=+p[0],mo=+p[1];
  $("month").textContent=new Date(y,mo-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});
  $("next").disabled=ym>=curMonth;
  var list=items.filter(function(e){return e.d.slice(0,7)===ym}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.id-a.id});
  var sum=list.reduce(function(s,e){return s+e.a},0);
  $("total").innerHTML=Math.round(sum).toString().replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0")+" <small>DA</small>";
  if(ym===curMonth){
    var t=todayStr(),td=list.filter(function(e){return e.d===t}).reduce(function(s,e){return s+e.a},0);
    $("sub").textContent="Today: "+fmt(td);
  }else{$("sub").textContent=list.length+" expense"+(list.length===1?"":"s")+" this month"}

  var inc=incomeFor(ym),lb=$("leftbox");
  $("inc").textContent=inc?fmt(inc):"Not set";
  if(inc){var left=inc-sum;lb.className=left<0?"over":"";$("leftlbl").textContent=left<0?"Over by":"Left";$("left").textContent=fmt(Math.abs(left))}
  else{lb.className="";$("leftlbl").textContent="Left";$("left").textContent="–"}
  $("incsum").textContent=inc?"Change monthly income":"Set monthly income";
  if(!list.length){
    $("breakdown").innerHTML='<p class="empty">Nothing to show yet.</p>';
    $("list").innerHTML='<p class="empty">No expenses this month. Add one above.</p>';
    return;
  }
  var by=CATS.map(function(){return 0});
  list.forEach(function(e){by[e.c]+=e.a});
  var order=by.map(function(v,i){return i}).filter(function(i){return by[i]>0}).sort(function(a,b){return by[b]-by[a]});
  $("breakdown").innerHTML='<div class="seg">'+order.map(function(i){return '<i style="'+col(i)+';width:'+(by[i]/sum*100)+'%"></i>'}).join("")+'</div>'+
    '<ul class="legend">'+order.map(function(i){return '<li style="'+col(i)+'">'+CATS[i][0]+'<b>'+fmt(by[i])+'</b><em>'+Math.round(by[i]/sum*100)+'%</em></li>'}).join("")+'</ul>';

  var html="",last="";
  list.forEach(function(e){
    if(e.d!==last){
      last=e.d;
      var q=e.d.split("-"),dt=new Date(+q[0],+q[1]-1,+q[2]);
      var dayTotal=list.filter(function(x){return x.d===e.d}).reduce(function(s,x){return s+x.a},0);
      html+='<div class="day"><span>'+dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+'</span><span>'+fmt(dayTotal)+'</span></div>';
    }
    var isSure=sure===e.id;
    html+='<div class="item" style="'+col(e.c)+'"><span class="dot"></span><div class="what">'+CATS[e.c][0]+(e.n?'<small>'+esc(e.n)+'</small>':'')+'</div><span class="n">'+fmt(e.a)+'</span>'+
      '<button class="del'+(isSure?" sure":"")+'" data-id="'+e.id+'" aria-label="Delete expense">'+(isSure?"Sure?":"✕")+'</button></div>';
  });
  $("list").innerHTML=html;
}

$("amount").addEventListener("input",function(){this.value=this.value.replace(/[^\d]/g,"")});
$("form").addEventListener("submit",function(ev){
  ev.preventDefault();
  var a=parseInt($("amount").value,10),d=$("date").value||todayStr();
  if(!a||a<=0){setMsg("Enter an amount above 0.",true);$("amount").focus();return}
  var c=+document.querySelector('input[name="cat"]:checked').value;
  items.push({id:Date.now()+Math.floor(Math.random()*1000),a:a,c:c,n:$("note").value.trim(),d:d});
  persist();
  if(d.slice(0,7)>curMonth){d=todayStr();$("date").value=d}
  ym=d.slice(0,7);
  $("amount").value="";$("note").value="";
  if(canSave)setMsg("Saved: "+fmt(a)+" for "+CATS[c][0]+".",false);
  render();$("amount").focus();
});
$("list").addEventListener("click",function(ev){
  var b=ev.target.closest(".del");if(!b)return;
  var id=+b.getAttribute("data-id");
  clearTimeout(sureT);
  if(sure===id){
    items=items.filter(function(e){return e.id!==id});sure=null;persist();setMsg("Expense deleted.",false);
  }else{
    sure=id;sureT=setTimeout(function(){sure=null;render()},3000);
  }
  render();
});
$("incamt").addEventListener("input",function(){this.value=this.value.replace(/[^\d]/g,"")});
$("incform").addEventListener("submit",function(ev){
  ev.preventDefault();
  var v=parseInt($("incamt").value,10),im=$("incmsg");
  if(!v||v<=0){im.textContent="Enter an income above 0.";im.className="msg err";$("incamt").focus();return}
  income[ym]=v;persistIncome();
  $("incamt").value="";im.textContent="";im.className="msg";$("incbox").open=false;
  render();
});
function shift(n){
  var p=ym.split("-"),dt=new Date(+p[0],+p[1]-1+n,1);
  var next=dt.getFullYear()+"-"+pad(dt.getMonth()+1);
  if(next>curMonth)return;
  ym=next;sure=null;render();
}
$("prev").addEventListener("click",function(){shift(-1)});
$("next").addEventListener("click",function(){shift(1)});
if(!canSave)setMsg("Your browser can’t save data, so expenses will be lost when you close this page.",true);
render();
})();
</script>
</body>
</html>
